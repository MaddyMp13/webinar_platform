<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 18px;
        }

        .container {
            padding: 20px;
            max-width: 1440px;
            background-color: white;
            margin: 30px auto;
        }

        .content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .card {
            max-width: 300px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border: 1px solid rgba(70, 112, 226, 0.3);
            border-radius: 10px;
            box-shadow: 10px 10px 10px #e3e3e3;
        }

        .card img {
            width: 70%;
        }

        .card a {
            text-decoration: none;
            color: #fff;
            background-color: #4670e2;
            padding: 10px 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <main>
        <div class="container">
            <div class="logo">
                <img src="Google-Logo-Tech-Company.png" alt="" width="200">
            </div>
            <hr>
            <div class="content">

            </div>
        </div>
    </main>


    <script src="script.js"></script>
</body>

</html>
